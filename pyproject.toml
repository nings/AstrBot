[project]
name = "AstrBot"
version = "4.26.7"
description = "Easy-to-use multi-platform LLM chatbot and development framework"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"

keywords = ["AstrBot", "Agent", "Chatbot", "IM"]

dependencies = [
  "aiocqhttp>=1.4.4",
  "aiodocker>=0.24.0",
  "aiohttp>=3.11.18",
  "aiosqlite>=0.21.0",
  "anthropic>=0.51.0",
  "apscheduler>=3.11.0",
  "certifi>=2025.4.26",
  "chardet~=5.1.0",
  "loguru>=0.7.2",
  "cryptography>=44.0.3",
  "dashscope>=1.23.2",
  "deprecated>=1.2.18",
  "dingtalk-stream>=0.22.1",
  "docstring-parser>=0.16",
  "faiss-cpu>=1.14.3",
  "fastapi>=0.124.0",
  "filelock>=3.18.0",
  "google-genai>=1.56.0",
  "httpx[socks]>=0.28.1",
  "lark-oapi>=1.4.15",
  "mcp>=1.8.0,<2",
  "openai>=1.78.0",
  "ormsgpack>=1.9.1",
  "pillow>=11.2.1",
  "pip>=25.1.1",
  "psutil>=5.8.0,<7.2.0",
  "py-cord>=2.6.1",
  "pydantic>=2.12.5",
  "pydub>=0.25.1",
  "pyjwt>=2.10.1",
  "qrcode>=8.2",
  "quart>=0.20.0",
  "python-telegram-bot>=22.6",
  "qq-botpy==1.2.1",
  "silk-python>=0.2.6",
  "slack-sdk>=3.35.0",
  "sqlalchemy[asyncio]>=2.0.41",
  "sqlmodel>=0.0.24",
  "telegramify-markdown>=1.0.0",
  "watchfiles>=1.0.5",
  "websockets>=15.0.1",
  "wechatpy>=1.8.18",
  "audioop-lts ; python_full_version >= '3.13'",
  "click>=8.2.1",
  "pypdf>=6.1.1",
  "aiofiles>=25.1.0",
  "rank-bm25>=0.2.2",
  "jieba>=0.42.1",
  "markitdown-no-magika[docx,xls,xlsx]>=0.1.2",
  "xinference-client",
  "tenacity>=9.1.2",
  "shipyard-python-sdk>=0.2.4",
  "shipyard-neo-sdk>=0.2.0",
  "python-socks>=2.8.0",
  "pysocks>=1.7.1",
  "packaging>=24.2",
  "python-ripgrep==0.0.8 ; python_version < '3.14'",
  "pyotp>=2.9.0",
]

[dependency-groups]
dev = [
  "commitizen>=4.9.1",
  "import-linter>=2.5",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=6.2.1",
  "ruff==0.15.22",
]

[project.scripts]
astrbot = "astrbot.cli.__main__:cli"

[project.urls]
Repository = "https://github.com/AstrBotDevs/AstrBot"

[tool.ruff]
exclude = ["astrbot/core/utils/t2i/local_strategy.py", "astrbot/api/all.py", "tests"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "Q",     # flake8-quotes
  "I",     # import-order
  "UP",    # pyupgrade
  # "SIM", # flake8-simplify 
]
ignore = [
  "F403",
  "F405",
  "E501",
  "ASYNC230", # TODO: handle ASYNC230 in AstrBot
  "ASYNC240", # TODO: handle ASYNC240 in AstrBot
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.10"
reportMissingTypeStubs = false
reportMissingImports = false
include = ["astrbot"]
exclude = ["dashboard", "node_modules", "dist", "data", "tests"]

[tool.hatch.metadata]
allow-direct-references = true

# Include bundled dashboard dist even though it is not tracked by VCS.
[tool.hatch.build]
artifacts = ["astrbot/dashboard/dist/**"]

# Custom build hook: builds the Vue dashboard and copies dist into the package.
[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# webui capability-wall enforcement (see design/webui-multiuser-plan.md
# section 4). These contracts turn the "only core_facade.py may reach the core
# dashboard/services/persistence internals" convention into a CI-enforced guarantee.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["astrbot"]

[[tool.importlinter.contracts]]
name = "webui capability wall: only core_facade may import chat_service/conversation_mgr/persona_mgr"
type = "forbidden"
source_modules = ["astrbot.webui"]
forbidden_modules = [
  "astrbot.dashboard.services.chat_service",
  "astrbot.core.conversation_mgr",
  "astrbot.core.persona_mgr",
]
# NOTE: astrbot.core.utils.shared_preferences deliberately is NOT listed here.
# astrbot/core/utils/ has no __init__.py (it is an implicit namespace package,
# as is astrbot/core/agent/), so grimp -- import-linter's module grapher --
# indexes zero modules under that prefix and the entry would silently pass
# without ever being checked. Adding an __init__.py purely to satisfy the
# linter would be a third core intrusion against repo convention, so that one
# boundary is enforced by tests/test_webui_capability_wall.py instead.
ignore_imports = [
  "astrbot.webui.services.core_facade -> astrbot.dashboard.services.chat_service",
]
# Direct imports only: astrbot/core/__init__.py itself imports shared_preferences
# (for its module-level `sp` singleton) and chat_service pulls in core_lifecycle
# for unrelated wiring -- transitive/indirect checking would flag every webui
# file that merely does `from astrbot.core import logger`, which is not what
# this contract is guarding against. We care whether webui code *directly*
# reaches these modules.
allow_indirect_imports = "True"

[[tool.importlinter.contracts]]
name = "webui must never import conversation_service/session_management_service/api_key_service/subagent_orchestrator"
type = "forbidden"
source_modules = ["astrbot.webui"]
forbidden_modules = [
  "astrbot.dashboard.services.conversation_service",
  "astrbot.dashboard.services.session_management_service",
  "astrbot.dashboard.services.api_key_service",
  "astrbot.core.subagent_orchestrator",
]
# Same rationale as above: astrbot.webui.services.core_facade -> chat_service ->
# core_lifecycle -> subagent_orchestrator is an incidental transitive module
# load (core_lifecycle wires up the orchestrator for the core runtime; webui
# code never touches the imported symbol), not a capability-wall breach. Direct
# imports are what must never happen.
allow_indirect_imports = "True"
