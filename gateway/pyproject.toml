[project]
name = "astrbot-gateway"
version = "0.1.0"
description = "Standalone multi-user gateway in front of the AstrBot Open API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "markitdown-no-magika[docx,pdf,pptx,xls,xlsx]>=0.1.2",
  "pyjwt>=2.8.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astrbot_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
